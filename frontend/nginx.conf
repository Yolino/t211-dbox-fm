events {}

http {
  server {
    listen 80;
    server_name localhost;

    # REST API exposed for the non-HTTP-capable Raspberry Pi Pico (https://github.com/Sleeeee/t207-dbox-fm)
    location /api/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    ssl_certificate /etc/cert/server/localhost-selfsigned.crt;
    ssl_certificate_key /etc/cert/server/localhost-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    ssl_client_certificate /etc/cert/client/ca.crt;
    ssl_verify_client optional;

    server_name localhost;
    merge_slashes off;

    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }

    location /graphql {
      return 301 /graphql/;
    }

    location /graphql/ {
      proxy_pass http://backend:8000/graphql/;

      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
      }

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_pass_request_headers on;
      proxy_pass_request_body on;

      client_max_body_size 20M;
      client_body_buffer_size 20M;
    }

    location /media/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
    }

    location /api/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
      if ($ssl_client_verify != SUCCESS) {
        return 301 /;
      }
      proxy_pass http://backend:8000/admin/;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/admin/ {
      alias /usr/share/nginx/html/static/django/admin/;
    }
    location /static/rest_framework/ {
      alias /usr/share/nginx/html/static/django/rest_framework/;
    }

    location /verify-email/ {
      proxy_pass http://backend:8000/verify-email/;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /password_reset/ {
      proxy_pass http://backend:8000/password_reset/;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;		   
    }
    location /reset/ {
      proxy_pass http://backend:8000/reset/;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /kibana/ {
      if ($ssl_client_verify != SUCCESS) {
        return 301 /;
      }
      proxy_pass http://kibana:5601;
    }
  }
  include mime.types;
}
