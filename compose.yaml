services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: dbox-db:prod
    container_name: dbox-db-prod
    secrets:
      - db_name
      - db_user
      - db_password
      - db_django_password
    environment:
      - POSTGRES_DB_FILE=/run/secrets/db_name
      - POSTGRES_USER_FILE=/run/secrets/db_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    volumes:
      - prod_db_data:/var/lib/postgresql/data
    networks:
      - prod_orm

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dbox-backend:prod
    container_name: dbox-backend-prod
    secrets:
      - db_name
      - db_user
      - db_django_password
      - django_key
      - email_password
    volumes:
      - prod_media_files:/media
      - prod_static_files:/usr/share/nginx/html/static
    networks:
      - prod_orm
      - prod_api
      - prod_log
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: dbox-frontend:prod
    container_name: dbox-frontend-prod
    volumes:
      - prod_media_files:/usr/share/nginx/html/media
      - prod_static_files:/usr/share/nginx/html/static/django
    networks:
      - prod_api
      - prod_log
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - kibana

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: dbox-es-prod
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - prod_esdata:/usr/share/elasticsearch/data
    networks:
      - prod_log

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.2
    container_name: dbox-logstash-prod
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    networks:
      - prod_log
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: dbox-kibana-prod
    networks:
      - prod_log
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
    depends_on:
      - elasticsearch

secrets:
  db_name:
    file: ./.secrets/prod/db_name.txt
  db_user:
    file: ./.secrets/prod/db_user.txt
  db_password:
    file: ./.secrets/prod/db_password.txt
  db_django_password:
    file: ./.secrets/prod/db_django_password.txt
  django_key:
    file: ./.secrets/prod/django_key.txt
  email_password:
    file: ./.secrets/prod/email_password.txt

volumes:
  prod_db_data:
  prod_media_files:
  prod_static_files:
  prod_esdata:

networks:
  prod_api:
  prod_orm: 
  prod_log:
    internal: true

