services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: dbox-db:dev
    container_name: dbox-db-dev
    secrets:
      - db_name
      - db_user
      - db_password
      - db_django_password
    environment:
      - POSTGRES_DB_FILE=/run/secrets/db_name
      - POSTGRES_USER_FILE=/run/secrets/db_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    volumes:
      - dev_db_data:/var/lib/postgresql/data
    networks:
      - dev_orm

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dbox-backend:dev
    container_name: dbox-backend-dev
    secrets:
      - db_name
      - db_django_password
      - django_key
      - email_password
    volumes:
      - ./backend:/app
      - dev_media_files:/media
    networks:
      - dev_orm
      - dev_api
      - dev_log
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: dbox-frontend:dev
    container_name: dbox-frontend-dev
    volumes:
      - ./frontend:/app:cache
      - dev_node_modules:/app/node_modules
    networks:
      - dev_api
    ports: 
      - "3000:3000"
    depends_on:
      - backend

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - dev_log
    ports:
      - "9200:9200"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.2
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    networks:
      - dev_log
    ports:
      - "5044:5044" # for beats
      - "5000:5000" # for tcp
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    networks:
      - dev_log
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

secrets:
  db_name:
    file: ./.secrets/dev/db_name.txt
  db_user:
    file: ./.secrets/dev/db_user.txt
  db_password:
    file: ./.secrets/dev/db_password.txt
  db_django_password:
    file: ./.secrets/dev/db_django_password.txt
  django_key:
    file: ./.secrets/dev/django_key.txt
  email_password:
    file: ./.secrets/dev/email_password.txt

volumes:
  dev_db_data:
  dev_media_files:
  dev_node_modules:
  esdata:

networks:
  dev_api:
  dev_orm:
  dev_log:
