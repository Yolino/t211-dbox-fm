services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: db
    secrets:
      - db_name
      - db_user
      - db_password
      - db_django_password
    environment:
      - POSTGRES_DB_FILE=/run/secrets/db_name
      - POSTGRES_USER_FILE=/run/secrets/db_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - orm

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    secrets:
      - db_name
      - db_django_password
      - django_key
    volumes:
      - ./backend:/app
      - media_files:/media
    networks:
      - orm
      - api
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - ./frontend:/app:cache
      - node_modules:/app/node_modules
    networks:
      - api
    ports: 
      - "3000:3000"
    depends_on:
      - backend

secrets:
  db_name:
    file: ./.secrets/db_name.txt
  db_user:
    file: ./.secrets/db_user.txt
  db_password:
    file: ./.secrets/db_password.txt
  db_django_password:
    file: ./.secrets/db_django_password.txt
  django_key:
    file: ./.secrets/django_key.txt

volumes:
  db_data:
  media_files:
  node_modules:

networks:
  api:
  orm:
