services:
  db:
    image: slyven/dbox:db-0.1
    container_name: dbox-db
    secrets:
      - db_name
      - db_user
      - db_password
      - db_django_password
    environment:
      - POSTGRES_DB_FILE=/run/secrets/db_name
      - POSTGRES_USER_FILE=/run/secrets/db_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    volumes:
      - prod_db_data:/var/lib/postgresql/data
    networks:
      - prod_orm
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django -d dbox-fm -h localhost || exit 1"]
      interval: 300s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dbox-backend
    secrets:
      - db_name
      - db_user
      - db_django_password
      - django_key
      - email_password
    volumes:
      - prod_media_files:/media
      - prod_static_files:/usr/share/nginx/html/static/
    networks:
      - prod_orm
      - prod_api
      - prod_mail
      - prod_log
    depends_on:
      - db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -s -X POST http://localhost:8000/graphql/ -H 'Content-Type: application/json' -d '{\"query\":\"{ __typename }\"}' | grep -q '__typename'"]
      interval: 300s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dbox-frontend
    volumes:
      - prod_media_files:/usr/share/nginx/html/media
      - prod_static_files:/usr/share/nginx/html/static/django
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/nginx/ssl/server:ro
      - ./client_ca:/etc/nginx/ssl/client:ro
    networks:
      - prod_api
      - prod_log
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 300s
      timeout: 10s
      retries: 3

  alloy:
    build:
      context: ./alloy
      dockerfile: Dockerfile
    container_name: dbox-alloy
    volumes:
      - prod_alloy_data:/var/lib/alloy/data
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log/docker-health.log:/var/log/docker-health.log
    networks:
      - prod_log
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f -o /dev/null http://localhost:12345/-/healthy || exit 1"]
      interval: 300s
      timeout: 10s
      retries: 3

secrets:
  db_name:
    file: ./.secrets/prod/db_name.txt
  db_user:
    file: ./.secrets/prod/db_user.txt
  db_password:
    file: ./.secrets/prod/db_password.txt
  db_django_password:
    file: ./.secrets/prod/db_django_password.txt
  django_key:
    file: ./.secrets/prod/django_key.txt
  email_password:
    file: ./.secrets/prod/email_password.txt

volumes:
  prod_db_data:
    name: dbox_prod_db_data
  prod_media_files:
    name: dbox_prod_media_files
  prod_static_files:
    name: dbox_prod_static_files
  prod_alloy_data:
    name: dbox_prod_alloy_data

networks:
  prod_api:
  prod_orm:
    internal: true
  prod_mail:
    external: true
    name: dbox_prod_mail
  prod_log:
